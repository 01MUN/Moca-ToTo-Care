openapi: 3.0.3
info:
  title: Moca-ToTo Care API Specification
  description: Moca-ToTo Care (모카토토 케어) 백엔드 RESTful API Specification & OpenAPI 3.0 Document
  version: 1.1.0
servers:
  - url: https://ais-dev-46r2ew3mjxuswyukwfreqm-626233427705.asia-northeast1.run.app/api/v1
    description: Cloud Run Container Development Server
  - url: http://localhost:3000/api/v1
    description: Local Development Server

# All operations require a Bearer JWT unless they override with `security: []`.
# Public: POST /auth/login, POST /auth/signup, GET /places/nearby, GET /places/{placeId}.
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: 로그인 (JWT 발급)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "moca_mom@toto.com" }
                password: { type: string, maxLength: 72, description: "최대 72바이트(UTF-8)" }
      responses:
        '200': { description: "로그인 성공. data.token에 HS256 JWT(7일 만료)" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "이메일 또는 비밀번호 불일치", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/signup:
    post:
      summary: 회원가입 (JWT 발급, role은 항상 owner)
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nickname]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: "8자 이상, 최대 72바이트(UTF-8)" }
                nickname: { type: string, minLength: 1, maxLength: 30 }
      responses:
        '201': { description: "가입 완료. data.token에 JWT" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: "이미 가입된 이메일" }

  /pets:
    get:
      summary: 반려동물 목록 조회
      operationId: getPets
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: 성공적인 반려동물 리스트 반환
    post:
      summary: 신규 반려동물 등록
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "모카" }
                breed: { type: string, example: "토이푸들" }
                birthDate: { type: string, format: date, example: "2022-05-15" }
                weight: { type: number, example: 3.8 }
                traits: { type: string, example: "산책 러버" }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: 반려동물 생성 완료

  /pets/{petId}:
    delete:
      summary: 반려동물 삭제 (대표 보호자만)
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: "삭제 완료. 모든 사용자의 owned/shared 목록과 대기 중 초대 코드에서도 제거" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PetNotFound' }
    patch:
      summary: 반려동물 프로필 및 테마 수정 (대표 보호자만, 공동 양육자는 403)
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: 수정 성공

  /pets/{petId}/dashboard:
    get:
      summary: 홈 대시보드 케어 지수 및 활동 요약 조회
      operationId: getPetDashboard
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: 대시보드 종합 데이터 조회 성공

  /pets/{petId}/happiness:
    post:
      summary: 터치 교감 인터랙션에 따른 행복도 업데이트
      operationId: updateHappiness
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                increment: { type: integer, example: 5 }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: 행복도 상승 성공

  /records/daily:
    get:
      summary: 일일 체크리스트 조회
      operationId: getDailyRecords
      parameters:
        - name: petId
          in: query
          schema: { type: string }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: 조회 성공
    post:
      summary: 일일 체크리스트 기록 추가
      operationId: createDailyRecord
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: 생성 성공

  /records/health:
    get:
      summary: 건강 및 병원 방문 기록 조회
      operationId: getHealthRecords
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: 조회 성공
    post:
      summary: 건강 기록 등록
      operationId: createHealthRecord
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: 생성 성공

  /walks/start:
    post:
      summary: 실시간 산책 세션 시작
      operationId: startWalk
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: 산책 시작됨

  /walks/end:
    post:
      summary: 산책 종료 및 GPS 데이터 저장
      operationId: endWalk
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: 산책 종료 저장 완료

  /walks/{walkId}/shapeify:
    post:
      summary: GPS 경로 Shapeify 아트 변환 처리
      operationId: shapeifyRoute
      parameters:
        - name: walkId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetShape: { type: string, enum: [paw, heart, bone, raw], example: "paw" }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Shapeify 변환 메타데이터 생성 성공

  /places/nearby:
    get:
      summary: 위치 기반 주변 장소 검색 (병원, 카페, 공원, 미용실)
      operationId: getNearbyPlaces
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [all, hospital, cafe, park, grooming] }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: 주변 장소 목록 반환

  /ai/doctor-analyze:
    post:
      summary: Google Gemini 기반 AI 닥터 속마음 번역 및 수의사 케어 분석
      operationId: analyzeDoctorAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                petName: { type: string, example: "모카" }
                breed: { type: string, example: "토이푸들" }
                age: { type: string, example: "2살" }
                behaviorText: { type: string, example: "꼬리를 흔들며 신발을 물고 다니고 있어요" }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Gemini AI 분석 및 속마음 번역 결과 반환

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "POST /auth/login 또는 /auth/signup이 발급한 HS256 JWT (iss=fluffy-days, aud=fluffy-days-app, 7일 만료)"

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  path: { type: string, example: "email" }
                  message: { type: string }

  responses:
    PetNotFound:
      description: "반려동물이 없거나 요청자의 반려동물이 아님 (존재 여부를 숨기기 위해 두 경우 모두 동일한 404). petId를 받는 모든 API에 적용"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: "공동 양육자가 대표 보호자 전용 작업(프로필 수정, 삭제, 초대 코드 발급)을 시도"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: "입력값 검증 실패 또는 잘못된 JSON 본문 (본문 최대 10MB, 초과 시 413)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthorized:
      description: "토큰 없음/만료/위조. 클라이언트는 토큰을 지우고 로그인 화면으로 이동"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
