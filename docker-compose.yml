services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: mocatoto
      POSTGRES_PASSWORD: mocatoto_local
      POSTGRES_DB: mocatoto_care
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocatoto -d mocatoto_care"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
